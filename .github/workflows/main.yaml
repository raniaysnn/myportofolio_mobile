name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI: build_runner, dart format, flutter analyze, dan flutter test + coverage.
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      setup: dart run build_runner build --delete-conflicting-outputs
      coverage_excludes: "**/*.g.dart"
      min_coverage: 0
      timeout_minutes: 15

  # CD: build APK release setelah job build berhasil, lalu unggah sebagai artefak.
  build_apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 9 / Gradle 9 butuh JDK yang lebih baru dari default runner (17);
      # disamakan dengan JDK bawaan Android Studio yang dipakai saat build lokal.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate JSON serializable code
        run: dart run build_runner build --delete-conflicting-outputs

      # Repository variable API_BASE_URL berisi URL backend Django yang sudah
      # di-deploy; jika belum diatur, pakai default emulator agar tidak kosong.
      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'http://10.0.2.2:8000' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
